services:
  gordon-blog:
    build:
      context: .
    container_name: gordon-blog
    restart: unless-stopped
    depends_on:
      gordon-db:
        condition: service_healthy
    networks:
      - gordon-net
    ports:
      - "8103:8090"  # 修改外部端口为8103
    volumes:
      - ./xblog:/root/.xblog
    environment:
      JVM_OPTS: "-Xmx256m -Xms256m"
    command:
      - --spring.r2dbc.url=r2dbc:pool:postgresql://gordon-db/gordon
      - --spring.r2dbc.username=gordon
      - --spring.r2dbc.password=xgs587762
      - --spring.sql.init.platform=postgresql
      - --halo.external-url=http://localhost:8103/  # 修改external-url为8103端口
      - --halo.work-dir=/.xblog
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M

  gordon-db:
    image: postgres:15-alpine
    container_name: gordon-db
    restart: unless-stopped
    ports:
      - "15432:5432"
    networks:
      - gordon-net
    volumes:
      - ./db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: gordon
      POSTGRES_PASSWORD: xgs587762
      POSTGRES_DB: gordon
      PGUSER: gordon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gordon"]  # 修复健康检查命令格式
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s  # 添加启动等待时间
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

networks:
  gordon-net:
    name: gordon-net
    driver: bridge